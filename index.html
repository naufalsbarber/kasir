<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Kasir Naufal's Barber</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1b1916">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@500;600;700&family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Layout: single phone column — dark brand header, cream work surface, fixed bottom nav. Brand = pricelist (ink, cream, gold). */
:root{
  --ink:#1b1916; --ink2:#2a2621; --cream:#f3eee1; --paper:#fbf8f0; --line:#e2d9c6;
  --gold:#a8895a; --gold2:#c9ad7c; --muted:#7c7365; --ok:#3f7a52; --bad:#b4483b; --warn:#b07a2a;
  --qris:#3b5f8a;
  --f-display:"Josefin Sans","Futura","Century Gothic",sans-serif;
  --f-body:"Manrope","Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--f-body);font-size:15px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;min-height:100%;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:var(--cream);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:12px;border-bottom:1px solid #3a342c}
.top img{width:44px;height:44px;object-fit:contain}
.top .brand{flex:1;min-width:0}
.top .brand b{display:block;font-family:var(--f-display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:15px}
.top .brand small{display:block;color:var(--gold2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:11px;padding:4px 9px;border-radius:99px;border:1px solid #4a4238;color:#d9cfbd;white-space:nowrap}
.pill.on{border-color:#4f7d5c;color:#9fd1ad}.pill.off{border-color:#8a4a3f;color:#f0a99d}.pill.loc{border-color:#6b5a3b;color:var(--gold2)}

main{padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--f-display);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:13px;color:var(--muted);margin:0}
h1{font-family:var(--f-display);font-weight:600;font-size:22px;margin:0;text-wrap:balance}
.sec{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat>span:first-child{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:var(--f-display)}
.stat b{display:block;font-size:20px;margin-top:2px;font-variant-numeric:tabular-nums}
.stat.hero{grid-column:1/-1;background:var(--ink);color:var(--cream);border-color:var(--ink)}
.stat.hero>span:first-child{color:var(--gold2)}
.stat .d{display:block;font-size:12px;margin-top:2px}
.stat.hero b{font-size:28px}

/* service buttons */
.svc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.svc button{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:104px;transition:transform .08s,border-color .15s}
.svc button:active{transform:scale(.97);border-color:var(--gold)}
.svc .nm{font-family:var(--f-display);font-weight:600;font-size:18px;color:var(--gold)}
.svc .pr{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.svc .ds{font-size:11px;color:var(--muted);line-height:1.35}

/* list */
.list{display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:flex;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.item:first-child{border-top:0}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.item.void .t,.item.void .v{text-decoration:line-through;color:var(--muted)}
.empty{padding:18px 14px;color:var(--muted);font-size:13.5px;text-align:center}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:6px;vertical-align:1px}
.tag.tunai{background:#e9e1cc;color:#6b5a3b}.tag.qris{background:#dde6f0;color:var(--qris)}.tag.void{background:#f2dcd8;color:var(--bad)}.tag.gold{background:var(--ink);color:var(--gold2)}

/* forms */
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-family:var(--f-display);letter-spacing:.06em;text-transform:uppercase}
input.in,select.in,textarea.in{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;font-family:var(--f-body);font-size:16px;text-transform:none;letter-spacing:0;color:var(--ink)}
textarea.in{min-height:84px;resize:vertical}
input.big{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:99px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:14px}
.chip.sel{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.chip.add{border-style:dashed;color:var(--muted);background:transparent}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:#e8e0cf;border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;padding:10px 6px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.sel{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(40,30,15,.12)}
.btn{border:0;border-radius:12px;padding:14px 16px;font-weight:700;font-size:15px;background:var(--ink);color:var(--cream);width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.gold{background:var(--gold);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid #e7c6c0}
.btn.wa{background:#1f7a4d;color:#fff}
.btn.sm{padding:9px 12px;font-size:13px;width:auto;border-radius:10px}
.btn:disabled{opacity:.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,16,12,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--cream);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;
  padding-block:8px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px;animation:up .2s ease-out}
.sheet .grab{width:42px;height:4px;border-radius:4px;background:#cfc4ae;margin:4px auto 0}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.x{border:0;background:#e8e0cf;width:34px;height:34px;border-radius:99px;font-size:18px;line-height:1}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:14px;background:var(--ink);color:var(--cream);border-radius:12px}
.total b{font-size:26px;font-variant-numeric:tabular-nums}
.total span{color:var(--gold2);font-family:var(--f-display);letter-spacing:.08em;text-transform:uppercase;font-size:12px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.scrim,.sheet{animation:none}}

/* nav */
nav.bot{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--ink);display:flex;justify-content:center;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.bot .in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:560px}
nav.bot button{border:0;background:transparent;color:#a39886;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;letter-spacing:.02em}
nav.bot button svg{width:22px;height:22px}
nav.bot button.sel{color:var(--gold2)}

.kv{display:flex;flex-direction:column}
.kv div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px dashed var(--line);font-variant-numeric:tabular-nums}
.kv div:first-child{border-top:0}
.kv div.strong{font-weight:800}
.sig{width:100%;height:150px;background:#fff;border:1px dashed #c9bda5;border-radius:12px;touch-action:none;display:block}
.toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--cream);padding:11px 16px;border-radius:12px;z-index:40;font-size:14px;max-width:90%;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.report-img{width:100%;border-radius:12px;border:1px solid var(--line);background:#fff}
.tabs{display:flex;gap:6px;overflow-x:auto}
.tabs button{border:1px solid var(--line);background:var(--paper);padding:8px 14px;border-radius:99px;font-weight:700;font-size:13px;white-space:nowrap}
.tabs button.sel{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.hint{font-size:12.5px;color:var(--muted);line-height:1.5}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.settings-row{display:grid;grid-template-columns:1fr 96px auto;gap:8px;align-items:center}
.settings-row input{padding:10px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-family:var(--f-display);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 4px;border-bottom:1px dashed var(--line)}
.tbl td.r,.tbl th.r{text-align:right}
.scrollx{overflow-x:auto}
.gear{border:1px solid #4a4238;background:transparent;color:#d9cfbd;width:34px;height:34px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none}
.gear svg{width:18px;height:18px}
.gear.sel{color:var(--gold2);border-color:var(--gold)}
.datebar{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:stretch}
.datebar>button{border:1px solid var(--line);background:var(--paper);border-radius:12px;font-size:24px;line-height:1;color:var(--ink)}
.datebar>button:disabled{opacity:.35}
.dlabel{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:7px 10px;cursor:pointer;min-width:0}
.dlabel b{font-size:15px;white-space:nowrap}
.dlabel small{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ok);font-family:var(--f-display)}
.dlabel small.past{color:var(--warn)}
.dlabel input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0}
.card.lock{border-color:#e4cfa6;background:#fbf3e2}

</style>
</head>

const CACHE_DAYS = 75;
const DB = {
  docs: {}, pending: {}, cfg: { url: '', key: '' }, status: 'local', lastSync: null,
  init() {
    this.docs = lsGet('nb_docs', {});
    this.pending = lsGet('nb_pending', {});
    const c = lsGet('nb_cfg', null);
    this.cfg = c && c.url ? c : { url: SUPABASE_URL, key: SUPABASE_KEY };
    this.status = this.online() ? 'sync' : 'local';
  },
  online() { return !!(this.cfg.url && this.cfg.key); },
  headers() {
    const h = { apikey: this.cfg.key, 'Content-Type': 'application/json' };
    if (!this.cfg.key.startsWith('sb_')) h.Authorization = 'Bearer ' + this.cfg.key;
    return h;
  },
  base() { return this.cfg.url.replace(/\/+$/, '') + '/rest/v1/nb_docs'; },
  saveCache() {
    const cut = addDays(today(), -CACHE_DAYS), out = {}, keepAll = !this.online();
    for (const [id, d] of Object.entries(this.docs)) if (keepAll || !d.tgl || d.tgl >= cut || this.pending[id]) out[id] = d;
    lsSet('nb_docs', out); lsSet('nb_pending', this.pending);
  },
  list(col) { return Object.values(this.docs).filter(d => d.col === col).map(d => d.data); },
  get(id) { return this.docs[id]?.data; },
  put(col, data, tgl = null, ts = null) {
    const doc = { id: data.id, col, tgl, data, updated_at: ts || nowISO() };
    this.docs[data.id] = doc; this.pending[data.id] = doc; this.saveCache(); this.flush();
    return data;
  },
  async flush() {
    if (!this.online() || this._flushing) { setStatus(); return; }
    const batch = Object.values(this.pending); if (!batch.length) { this.status = 'on'; setStatus(); return; }
    this._flushing = true; this.status = 'sync'; setStatus();
    try {
      const r = await fetch(this.base(), { method: 'POST', headers: { ...this.headers(), Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify(batch) });
      if (!r.ok) throw new Error(r.status + ' ' + (await r.text()).slice(0, 160));
      for (const d of batch) if (this.pending[d.id] === d) delete this.pending[d.id];
      this.saveCache(); this.status = 'on'; this.lastSync = new Date();
    } catch (e) { this.status = 'off'; this.lastErr = String(e.message || e); }
    this._flushing = false; setStatus();
    if (this.status === 'on' && Object.keys(this.pending).length) this.flush();
  },
  async fetchWhere(q) {
    const out = []; let off = 0;
    for (; ;) {
      const r = await fetch(this.base() + '?select=id,col,tgl,data,updated_at&' + q + '&order=id&limit=1000&offset=' + off, { headers: this.headers() });
      if (!r.ok) throw new Error(r.status + ' ' + (await r.text()).slice(0, 160));
      const rows = await r.json(); out.push(...rows); if (rows.length < 1000) break; off += 1000;
    }
    return out;
  },
  merge(rows) {
    // last-write-wins: data lokal yang belum terkirim hanya menang kalau lebih baru
    for (const d of rows) {
      const p = this.pending[d.id];
      if (!p || new Date(d.updated_at) >= new Date(p.updated_at)) { this.docs[d.id] = d; delete this.pending[d.id]; }
    }
  },
  async pull() {
    if (!this.online()) { this.status = 'local'; setStatus(); return; }
    try {
      const from = addDays(today(), -CACHE_DAYS);
      const rows = await this.fetchWhere('or=(tgl.is.null,tgl.gte.' + from + ')');
      this.merge(rows); applyRemoteReset(); this.saveCache(); this.status = Object.keys(this.pending).length ? 'sync' : 'on'; this.lastSync = new Date();
      this.flush();
    } catch (e) { this.status = 'off'; this.lastErr = String(e.message || e); }
    setStatus();
  },
  async remove(q) {   // hapus di server, q = filter PostgREST
    if (!this.online()) return;
    const r = await fetch(this.base() + '?' + q, { method: 'DELETE', headers: { ...this.headers(), Prefer: 'return=minimal' } });
    if (!r.ok) throw new Error(r.status + ' ' + (await r.text()).slice(0, 160));
  },
  async fetchAll() { return this.online() ? this.fetchWhere('id=not.is.null') : Object.values(this.docs); },
  async loadRange(from, to) {
    if (!this.online()) return;
    const rows = await this.fetchWhere('tgl=gte.' + from + '&tgl=lte.' + to);
    this.merge(rows);
  }
};

function setStatus() {
  const el = $('#status'); if (!el) return;
  const n = Object.keys(DB.pending).length;
  const map = { local: ['loc', 'Mode lokal'], on: ['on', 'Online'], sync: ['', 'Menyimpan…'], off: ['off', 'Offline' + (n ? ' · ' + n + ' antre' : '')] };
  const [c, t] = map[DB.status] || map.local;
  el.className = 'pill ' + c; el.textContent = t;
}

/* ---------- sheet & dialog ---------- */
function openSheet(html, onMount, { locked = false } = {}) {
  closeSheet();
  const w = document.createElement('div'); w.className = 'scrim'; w.id = 'scrim';
  w.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  if (!locked) w.addEventListener('click', e => { if (e.target === w) closeSheet(); });
  document.body.appendChild(w); onMount && onMount(w.querySelector('.sheet'));
  return w.querySelector('.sheet');
}
function closeSheet() { $('#scrim')?.remove(); }
function ask({ title, body = '', input = null, ok = 'OK', danger = false, cancel = 'Batal' }) {
  return new Promise(res => {
    const sh = openSheet(`<div class="hd"><h1>${esc(title)}</h1></div>
      ${body ? `<div class="hint">${body}</div>` : ''}
      ${input ? `<label class="f">${esc(input.label)}<${input.multi ? 'textarea' : 'input'} id="askIn" class="in" ${input.type ? `type="${input.type}"` : ''} placeholder="${esc(input.ph || '')}" value="${esc(input.value || '')}">${input.multi ? esc(input.value || '') + '</textarea>' : ''}</label>` : ''}
      <div class="grid2"><button class="btn ghost" id="askNo">${cancel}</button><button class="btn ${danger ? 'danger' : ''}" id="askOk">${ok}</button></div>`);
    const fin = v => { closeSheet(); res(v); };
    sh.querySelector('#askNo').onclick = () => fin(null);
    sh.querySelector('#askOk').onclick = () => {
      if (!input) return fin(true);
      const v = sh.querySelector('#askIn').value.trim();
      if (input.required && !v) { toast(input.required); return; }
      fin(v);
    };
    setTimeout(() => sh.querySelector('#askIn')?.focus(), 250);
  });
}

}

/* ---------- form transaksi ---------- */
function openTx(lay) {

      <details ${T.diskon ? 'open' : ''}><summary class="small muted" style="padding:4px 0">Promo / diskon</summary>
        <div class="grid2" style="margin-top:8px"><input id="dk" class="in" inputmode="numeric" placeholder="Potongan Rp" value="${T.diskon ? T.diskon.toLocaleString('id-ID') : ''}"><input id="dkk" class="in" placeholder="Keterangan, mis. Pelajar" value="${esc(T.ket)}"></div>
      </details>
      <div class="total"><span>Total</span><b>${rp(total)}</b></div>
      <button class="btn gold" id="save">Simpan Transaksi</button>
      </div>`;

    bindChips(sh, 'kapchips', (n) => { if (n) { T.kapster = n; lsSet('nb_lastKap', n); } draw(); });
    sh.querySelectorAll('[data-b]').forEach(b => b.onclick = () => { T.bayar = b.dataset.b; draw(); });
    const pq = sh.querySelector('#pq');
    if (pq) { pq.oninput = () => { T.q = pq.value; const pos = pq.selectionStart; draw(); const n = sh.querySelector('#pq'); n.focus(); n.setSelectionRange(pos, pos); }; }
    sh.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { T.pel = DB.get(b.dataset.p); draw(); });
    sh.querySelector('#pelX') && (sh.querySelector('#pelX').onclick = () => { T.pel = null; T.q = ''; draw(); });
    const bn = sh.querySelector('#bn'), bw = sh.querySelector('#bw');

    dkk.oninput = () => T.ket = dkk.value;

function saveTx(T) {
  if (!T.kapster) return toast('Pilih kapster dulu');
  if (!T.bayar) return toast('Pilih metode pembayaran: Tunai atau QRIS');
  if (T.diskon && !T.ket.trim()) return toast('Isi keterangan promo');
  let pel = T.pel;
  if (!pel && T.baru.nama.trim()) {
    const wa = normWA(T.baru.wa);
    if (T.baru.wa && wa.length < 10) return toast('Nomor WA belum lengkap');
    pel = wa ? DB.list('pelanggan').find(p => p.wa === wa) : null;
    if (!pel) pel = DB.put('pelanggan', { id: uid('pel'), nama: T.baru.nama.trim(), wa, visits: 0, lastVisit: null, kapCount: {}, createdAt: nowISO() });
  }
  const tgl = today();
  const baru = pel ? !(pel.visits > 0) : null;
  const tx = {
    id: uid('tx'), nota: nextNota(tgl), tgl, at: nowISO(), layananId: T.lay.id, layanan: T.lay.nama, harga: T.lay.harga,
    diskon: T.diskon, ketPromo: T.diskon ? T.ket.trim() : '', total: Math.max(0, T.lay.harga - T.diskon), kapster: T.kapster,
    kasir: S.kasir, bayar: T.bayar, pelangganId: pel?.id || null, pelanggan: pel?.nama || '', wa: pel?.wa || '', pelangganBaru: baru,
    batal: false, log: []
  };
  DB.put('transaksi', tx, tgl);
  if (pel) { pel.visits = (pel.visits || 0) + 1; pel.lastVisit = tgl; pel.kapCount = pel.kapCount || {}; pel.kapCount[T.kapster] = (pel.kapCount[T.kapster] || 0) + 1; DB.put('pelanggan', pel); }
  render();
  let next = '';
  const sh = openSheet(`<div class="hd"><h1>Tersimpan ✓</h1></div>
    <div class="card kv"><div><span>Nota</span><b>${tx.nota}</b></div><div><span>${esc(tx.layanan)}</span><b>${rp(tx.harga)}</b></div>${tx.diskon ? `<div><span>Promo (${esc(tx.ketPromo)})</span><b>−${rp(tx.diskon)}</b></div>` : ''}<div class="strong"><span>Total · ${tx.bayar}</span><span>${rp(tx.total)}</span></div></div>
    ${tx.wa ? `<a class="btn wa" id="waS" href="${waLink(tx.wa, strukText(tx))}" target="_blank" rel="noopener">Kirim struk ke WA ${esc(tx.pelanggan)}</a>` : `<div class="hint">Struk WA tidak bisa dikirim karena nomor WA pelanggan tidak diisi.</div>`}
    <div class="card sec lock"><b>Siapa yang pegang kasir sekarang?</b>
      <div class="small muted">Sebelumnya: ${esc(S.kasir || '-')}. Pilih lagi supaya transaksi berikutnya tercatat atas nama yang benar.</div>
      <div id="nk"></div></div>
    <button class="btn" id="done" disabled>Pilih kasir dulu</button>`, null, { locked: true });
  const drawK = () => {
    sh.querySelector('#nk').innerHTML = kasirChips(next, 'nkchips', true);
    bindChips(sh, 'nkchips', n => { if (n) next = n; drawK(); });
    const d = sh.querySelector('#done'); d.disabled = !next; d.textContent = next ? 'Selesai · kasir ' + next : 'Pilih kasir dulu';
  };
  drawK();
  sh.querySelector('#done').onclick = () => {
    if (!next) return;
    if (next !== S.kasir) toast('Kasir sekarang: ' + next);
    S.kasir = next; lsSet('nb_kasir', next); closeSheet(); render();
  };
}

const waLink = (wa, text) => 'https://wa.me/' + wa + '?text=' + encodeURIComponent(text);
function strukText(t) {
  const W = 30, L = '-'.repeat(W), s = ST();
  const kv = (a, b) => { a = String(a); b = String(b); const sp = W - a.length - b.length; return sp >= 1 ? a + ' '.repeat(sp) + b : a + '\n' + ' '.repeat(Math.max(0, W - b.length)) + b; };
  const d = new Date(t.at);
  const body = [
    s.toko.toUpperCase(), s.alamat, L,
    kv('No. Nota', t.nota), kv('Tanggal', pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + jam(t.at)),
    kv('Kapster', t.kapster), t.pelanggan ? kv('Pelanggan', t.pelanggan.slice(0, 18)) : null, L,
    kv(t.layanan, rp(t.harga)), t.diskon ? kv('Diskon (' + t.ketPromo.slice(0, 12) + ')', '-' + rp(t.diskon)) : null,
    kv('TOTAL', rp(t.total)), kv('Pembayaran', t.bayar), L
  ].filter(x => x != null).join('\n');
  return '```\n' + body + '\n```\n' + fill(s.tplFooter, { ...tplVars(), nama: t.pelanggan });
}

    if (!a) return;
    t.batal = true; t.batalAlasan = a; t.batalAt = nowISO(); t.batalOleh = S.kasir || 'Owner'; addLog(t, 'Batal', a);

function editTx(t) {
  const E = { kapster: t.kapster, bayar: t.bayar };
  const sh = openSheet('<div id="eb"></div>');
  const draw = () => {
    sh.querySelector('#eb').innerHTML = `<div class="sec"><div class="hd"><h1>Ubah ${t.nota}</h1><button class="x" id="cx">×</button></div>
      <label class="f">Kapster</label>${kasirChips(E.kapster, 'ekap')}
      <label class="f">Pembayaran</label><div class="seg"><button data-b="Tunai" class="${E.bayar === 'Tunai' ? 'sel' : ''}">Tunai</button><button data-b="QRIS" class="${E.bayar === 'QRIS' ? 'sel' : ''}">QRIS</button></div>
      <div class="hint">Untuk salah layanan atau harga, batalkan transaksi ini lalu input ulang.</div>
      <button class="btn" id="ok">Simpan perubahan</button></div>`;
    sh.querySelector('#cx').onclick = closeSheet;
    bindChips(sh, 'ekap', n => { if (n) E.kapster = n; draw(); });
    sh.querySelectorAll('[data-b]').forEach(b => b.onclick = () => { E.bayar = b.dataset.b; draw(); });
    sh.querySelector('#ok').onclick = () => {
      const ch = [];
      if (E.kapster !== t.kapster) ch.push('kapster ' + t.kapster + '→' + E.kapster);
      if (E.bayar !== t.bayar) ch.push('bayar ' + t.bayar + '→' + E.bayar);
      if (!ch.length) return closeSheet();
      t.kapster = E.kapster; t.bayar = E.bayar; addLog(t, 'Ubah', ch.join(', '));
      DB.put('transaksi', t, t.tgl); closeSheet(); render(); toast('Perubahan disimpan');
    };
  };
  draw();
}

function editPg(p) {
  let kat = p.kategori;
  const sh = openSheet(`<div class="hd"><h1>Ubah pengeluaran</h1><button class="x" id="cx">×</button></div>
    ${p.batal ? `<div class="card"><b style="color:var(--bad)">Dibatalkan</b><div class="small muted">${esc(p.batalAlasan || '')}</div></div>` : kasLocked(p.tgl) ? `<div class="card kv"><div><span>${esc(p.ket)} (${esc(p.kategori)})</span><b>${rp(p.nominal)}</b></div></div><div class="hint">Kas sudah ditutup, jadi pengeluaran ini tidak bisa diubah. Buka kembali kas di menu Tutup Kas kalau perlu koreksi.</div>` : `

  };
}

/* ============================================================
   REKAP HARIAN
   ============================================================ */
function dayStats(tgl) {
  const tx = txOn(tgl), ok = tx.filter(t => !t.batal), batal = tx.filter(t => t.batal);
  const pg = pgOn(tgl).filter(p => !p.batal), kas = kasOf(tgl);
  const sum = (a, f = () => true) => a.filter(f).reduce((s, t) => s + (t.total ?? t.nominal), 0);
  const perLay = {}, perKap = {};
  for (const t of ok) {
    (perLay[t.layanan] ||= { n: 0, v: 0 }); perLay[t.layanan].n++; perLay[t.layanan].v += t.total;
    (perKap[t.kapster] ||= { n: 0, v: 0 }); perKap[t.kapster].n++; perKap[t.kapster].v += t.total;
  }
  const tunai = sum(ok, t => t.bayar === 'Tunai'), qris = sum(ok, t => t.bayar === 'QRIS'), totalPg = sum(pg);
  const modal = kas?.modal || 0, seharusnya = modal + tunai - totalPg;
  return { tgl, tx, ok, batal, pg, kas, total: tunai + qris, tunai, qris, totalPg, modal, seharusnya, diskon: ok.reduce((a, t) => a + (t.diskon || 0), 0), perLay, perKap };
}

function sigPad(c) {
  const r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;

  let draw = false, has = false, lx = 0, ly = 0;
  const pos = e => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  c.onpointerdown = e => { draw = true; [lx, ly] = pos(e); c.setPointerCapture(e.pointerId); };
  c.onpointermove = e => { if (!draw) return; const [nx, ny] = pos(e); x.beginPath(); x.moveTo(lx, ly); x.lineTo(nx, ny); x.stroke(); lx = nx; ly = ny; has = true; };
  c.onpointerup = c.onpointercancel = () => draw = false;
  return {
    clear: () => { x.clearRect(0, 0, c.width, c.height); has = false; }, empty: () => !has,
    data: () => { const o = document.createElement('canvas'); o.width = 480; o.height = 150; const ox = o.getContext('2d'); ox.drawImage(c, 0, 0, 480, 150); return o.toDataURL('image/png'); }
  };
}

}

/* ---------- bulanan ---------- */
function monthRange(ym) { const [y, m] = ym.split('-').map(Number); const n = new Date(y, m, 0).getDate(); return { from: ym + '-01', to: ym + '-' + pad(n), n }; }
function prevYM(ym) { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 2, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
function monthStats(ym) {
  const { n } = monthRange(ym);
  const tx = DB.list('transaksi').filter(t => t.tgl.startsWith(ym)), ok = tx.filter(t => !t.batal);
  const pg = DB.list('pengeluaran').filter(p => p.tgl.startsWith(ym) && !p.batal);
  const days = Array.from({ length: n }, (_, i) => ({ d: i + 1, v: 0, n: 0, tunai: 0, qris: 0, baru: 0, balik: 0, anon: 0 }));
  const perLay = {}, perKap = {}, perJam = {}, perKat = {}; let tunai = 0, qris = 0, baru = 0, balik = 0, anon = 0, diskon = 0;
  for (let h = 8; h <= 21; h++) perJam[h] = 0;
  for (const t of ok) {
    const D = days[+t.tgl.slice(8) - 1]; D.v += t.total; D.n++;
    (perLay[t.layanan] ||= { n: 0, v: 0 }); perLay[t.layanan].n++; perLay[t.layanan].v += t.total;
    (perKap[t.kapster] ||= { n: 0, v: 0 }); perKap[t.kapster].n++; perKap[t.kapster].v += t.total;
    const h = new Date(t.at).getHours(); perJam[h] = (perJam[h] || 0) + 1;
    if (t.bayar === 'QRIS') { qris += t.total; D.qris += t.total; } else { tunai += t.total; D.tunai += t.total; }
    if (t.pelangganBaru === true) { baru++; D.baru++; } else if (t.pelangganBaru === false) { balik++; D.balik++; } else { anon++; D.anon++; }
    diskon += t.diskon || 0;
  }
  for (const p of pg) perKat[p.kategori] = (perKat[p.kategori] || 0) + p.nominal;
  // rata-rata pelanggan per hari dalam seminggu (hanya hari yang buka)
  const dowSum = Array(7).fill(0), dowCnt = Array(7).fill(0);
  for (const D of days) if (D.n) { const w = new Date(ym + '-' + pad(D.d) + 'T00:00:00').getDay(); dowSum[w] += D.n; dowCnt[w]++; }
  const ORDER = [1, 2, 3, 4, 5, 6, 0];
  const dow = ORDER.map(w => ({ label: HARI[w].slice(0, 3), v: dowCnt[w] ? dowSum[w] / dowCnt[w] : 0 }));
  const kasDocs = DB.list('kas').filter(k => k.tgl.startsWith(ym));
  const selisih = kasDocs.reduce((a, k) => a + (k.tutup?.selisih || 0), 0), hariSelisih = kasDocs.filter(k => k.tutup?.selisih).length;
  const total = tunai + qris, totalPg = pg.reduce((a, p) => a + p.nominal, 0), hariBuka = days.filter(d => d.n).length;
  const best = days.reduce((a, d) => d.v > a.v ? d : a, { v: 0, d: 0 });
  return { ym, n, tx, ok, batal: tx.length - ok.length, days, dow, perLay, perKap, perJam, perKat, tunai, qris, total, totalPg, laba: total - totalPg, baru, balik, anon, diskon, selisih, hariSelisih, hariBuka, best, avg: hariBuka ? total / hariBuka : 0, avgN: hariBuka ? ok.length / hariBuka : 0 };
}

const COL = { tunai: '#a8895a', qris: '#3b5f8a', baru: '#a8895a', balik: '#1b1916', anon: '#d6ccb8' };

    { title: 'Rata-rata pelanggan per hari (Senin–Minggu)', note: 'Membantu atur jadwal kapster: hari ramai perlu lebih banyak orang.',
      draw: (x, o) => barChart(x, { ...o, labels: M.dow.map(d => d.label), series: [{ vals: M.dow.map(d => d.v), color: C.gold }], fmt: cnt, int: true, valueLabels: dec }) },

    { title: 'Layanan terlaris', note: 'Jumlah kepala per layanan, beserta pendapatannya.', hbar: true,
      draw: (x, o) => hbarChart(x, { ...o, rows: sorted(M.perLay, 'n').map(([k, v]) => [k, v.n, v.n + ' kepala · ' + rp(v.v)]), color: C.gold }) },
    { title: 'Pendapatan per kapster', note: 'Jumlah kepala dan pendapatan yang dikerjakan tiap kapster.', hbar: true,
      draw: (x, o) => hbarChart(x, { ...o, rows: sorted(M.perKap, 'v').map(([k, v]) => [k, v.v, rp(v.v) + ' · ' + v.n + ' kepala']), color: C.ink }) },
    { title: 'Pengeluaran per kategori', note: `Total ${rp(M.totalPg)} · pendapatan bersih ${rp(M.laba)} (sebelum gaji)`, hbar: true,
      draw: (x, o) => hbarChart(x, { ...o, rows: sorted(M.perKat).map(([k, v]) => [k, v, rp(v)]), color: C.bad }) }
  ];
}

/* bar chart (tunggal atau bertumpuk) */
function barChart(x, { x0 = 0, y0 = 0, w, h, fs = 1, labels, series, avg = null, fmt = String, int = false, avgFmt = null, valueLabels = null }) {
  const stacked = series.length > 1, legendH = stacked ? 22 * fs : 0;
  const L = 46 * fs, B = 22 * fs, Tp = 16 * fs + legendH, R = 6 * fs, pw = w - L - R, ph = h - B - Tp;
  const tot = labels.map((_, i) => series.reduce((a, s) => a + (s.vals[i] || 0), 0));
  const max = Math.max(1, ...tot, avg || 0), nice = int ? Math.max(4, Math.ceil(max / 4) * 4) : niceMax(max), step = pw / Math.max(1, labels.length);
  x.save(); x.translate(x0, y0); x.textBaseline = 'middle';
  if (stacked) { let lx = L; x.font = `600 ${11 * fs}px Manrope, sans-serif`; x.textAlign = 'left'; series.forEach(s => { x.fillStyle = s.color; x.fillRect(lx, 4 * fs, 11 * fs, 11 * fs); x.fillStyle = C.ink; x.fillText(s.name, lx + 15 * fs, 10 * fs); lx += x.measureText(s.name).width + 34 * fs; }); }
  x.font = `500 ${10 * fs}px Manrope, sans-serif`;
  for (let i = 0; i <= 4; i++) { const v = nice / 4 * i, yy = Tp + ph - ph * v / nice; x.strokeStyle = '#ece5d6'; x.lineWidth = 1; x.beginPath(); x.moveTo(L, yy); x.lineTo(w - R, yy); x.stroke(); x.fillStyle = C.muted; x.textAlign = 'right'; x.fillText(fmt(v), L - 6 * fs, yy); }
  labels.forEach((_, i) => { let base = Tp + ph; series.forEach(s => { const v = s.vals[i] || 0, bh = ph * v / nice; if (!bh) return; x.fillStyle = s.color; x.fillRect(L + i * step + step * .15, base - bh, step * .7, bh); base -= bh; }); });
  if (valueLabels) { x.fillStyle = C.ink; x.textAlign = 'center'; x.textBaseline = 'bottom'; x.font = `700 ${11 * fs}px Manrope, sans-serif`; tot.forEach((v, i) => v && x.fillText(valueLabels(v), L + i * step + step / 2, Tp + ph - ph * v / nice - 3 * fs)); }
  x.fillStyle = C.muted; x.textAlign = 'center'; x.textBaseline = 'top'; x.font = `500 ${10 * fs}px Manrope, sans-serif`;
  const every = Math.ceil(labels.length / (pw / (24 * fs)));
  labels.forEach((l, i) => { if (i % every === 0) x.fillText(l, L + i * step + step / 2, Tp + ph + 6 * fs); });
  if (avg) { const yy = Tp + ph - ph * avg / nice; x.strokeStyle = C.bad; x.setLineDash([5 * fs, 4 * fs]); x.lineWidth = 1.5 * fs; x.beginPath(); x.moveTo(L, yy); x.lineTo(w - R, yy); x.stroke(); x.setLineDash([]); x.fillStyle = C.bad; x.textAlign = 'right'; x.textBaseline = 'bottom'; x.font = `700 ${10 * fs}px Manrope, sans-serif`; x.fillText('rata-rata ' + (avgFmt || fmt)(avg), w - R, yy - 3 * fs); }
  x.restore();
}
function hbarChart(x, { x0 = 0, y0 = 0, w, h, fs = 1, rows, color }) {
  x.save(); x.translate(x0, y0);
  if (!rows.length) { x.fillStyle = C.muted; x.font = `500 ${13 * fs}px Manrope, sans-serif`; x.textAlign = 'left'; x.textBaseline = 'top'; x.fillText('Belum ada data.', 0, 4 * fs); x.restore(); return; }
  const max = Math.max(1, ...rows.map(r => r[1])), rowH = Math.min(52 * fs, h / rows.length);
  rows.forEach(([k, v, lab], i) => {
    const yy = i * rowH; x.textBaseline = 'alphabetic';
    x.font = `700 ${13 * fs}px Manrope, sans-serif`; x.fillStyle = C.ink; x.textAlign = 'left'; x.fillText(k, 0, yy + 16 * fs);
    x.font = `600 ${12 * fs}px Manrope, sans-serif`; x.fillStyle = C.muted; x.textAlign = 'right'; x.fillText(lab, w, yy + 16 * fs);
    x.fillStyle = '#ebe3d2'; x.fillRect(0, yy + 23 * fs, w, 12 * fs); x.fillStyle = color; x.fillRect(0, yy + 23 * fs, Math.max(2 * fs, w * v / max), 12 * fs);
  });
  x.restore();
}
function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v))), f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
function chartHeight(c, M) { return c.hbar ? Math.max(70, Object.keys(c.title.includes('Layanan') ? M.perLay : c.title.includes('kapster') ? M.perKap : M.perKat).length * 52) : 210; }

/* ---------- export ---------- */
function loadScript(src) { return new Promise((res, rej) => { if (document.querySelector(`script[src="${src}"]`)) return res(); const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Gagal memuat ' + src)); document.head.appendChild(s); }); }
async function exportPDF(M, P) {
  toast('Menyusun PDF…');
  try { await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'); } catch (e) { return toast('Perlu internet untuk export PDF'); }
  await document.fonts.ready; const logo = await loadLogo(), s = ST();
  const W = 1280, H = 720, slides = [];
  const mk = (title, fn, note) => { const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d'); x.fillStyle = C.cream; x.fillRect(0, 0, W, H);
    if (title) { x.fillStyle = C.ink; x.fillRect(0, 0, W, 110); if (logo) x.drawImage(logo, 40, 12, 86 * logo.width / logo.height, 86); x.fillStyle = C.gold2; x.font = '600 18px "Josefin Sans", sans-serif'; x.textAlign = 'left'; x.fillText((s.toko + ' · ' + fmtBln(M.ym)).toUpperCase(), 145, 46); x.fillStyle = C.cream; x.font = '800 34px Manrope, sans-serif'; x.fillText(title, 145, 86); }
    if (note) { x.fillStyle = C.muted; x.font = '600 20px Manrope, sans-serif'; x.textAlign = 'left'; x.fillText(note, 40, H - 28); }
    fn(x); slides.push(c); };
  const big = (x, X, Y, w, lab, val, sub, dark) => { x.fillStyle = dark ? C.ink : C.paper; x.fillRect(X, Y, w, 150); x.strokeStyle = C.line; x.lineWidth = 2; if (!dark) x.strokeRect(X, Y, w, 150); x.textAlign = 'left'; x.fillStyle = dark ? C.gold2 : C.muted; x.font = '600 17px "Josefin Sans", sans-serif'; x.fillText(lab.toUpperCase(), X + 24, Y + 40); x.fillStyle = dark ? C.cream : C.ink; x.font = '800 38px Manrope, sans-serif'; x.fillText(val, X + 24, Y + 92); if (sub) { x.fillStyle = dark ? '#d9cfbd' : C.muted; x.font = '500 17px Manrope, sans-serif'; x.fillText(sub, X + 24, Y + 128); } };
  const pct = (a, b) => b ? (a >= b ? '▲ ' : '▼ ') + Math.abs(Math.round((a - b) / b * 100)) + '% vs bulan lalu' : 'bulan lalu belum ada data';
  mk(null, x => { x.fillStyle = C.ink; x.fillRect(0, 0, W, H); if (logo) { const lh = 330; x.drawImage(logo, (W - lh * logo.width / logo.height) / 2, 70, lh * logo.width / logo.height, lh); }
    x.textAlign = 'center'; x.fillStyle = C.gold2; x.font = '600 26px "Josefin Sans", sans-serif'; x.fillText('LAPORAN BULANAN', W / 2, 470); x.fillStyle = C.cream; x.font = '800 60px Manrope, sans-serif'; x.fillText(fmtBln(M.ym), W / 2, 545); x.fillStyle = '#a39886'; x.font = '500 22px Manrope, sans-serif'; x.fillText(s.alamat, W / 2, 600); });
  mk('Ringkasan', x => { const w = (W - 80 - 48) / 3;
    big(x, 40, 150, w, 'Pendapatan kotor', rp(M.total), pct(M.total, P.total), true); big(x, 64 + w, 150, w, 'Jumlah pelanggan', String(M.ok.length), pct(M.ok.length, P.ok.length)); big(x, 88 + 2 * w, 150, w, 'Rata-rata per hari', rp(M.avg), M.avgN.toFixed(1).replace('.', ',') + ' kepala · ' + M.hariBuka + ' hari buka');
    big(x, 40, 330, w, 'Tunai', rp(M.tunai), M.total ? Math.round(M.tunai / M.total * 100) + '% dari pemasukan' : ''); big(x, 64 + w, 330, w, 'QRIS', rp(M.qris), M.total ? Math.round(M.qris / M.total * 100) + '% dari pemasukan' : ''); big(x, 88 + 2 * w, 330, w, 'Pengeluaran', rp(M.totalPg), '');
    big(x, 40, 510, w, 'Pendapatan bersih', rp(M.laba), 'kotor − pengeluaran (sebelum gaji)', true); big(x, 64 + w, 510, w, 'Selisih kas', rp(M.selisih), M.hariSelisih + ' hari ada selisih'); big(x, 88 + 2 * w, 510, w, 'Transaksi batal', String(M.batal), M.diskon ? 'promo ' + rp(M.diskon) : ''); });
  for (const c of monthCharts(M)) mk(c.title, x => c.draw(x, { x0: 40, y0: 150, w: W - 80, h: c.hbar ? 470 : 490, fs: 1.6 }), c.note);
  mk(null, x => { x.fillStyle = C.ink; x.fillRect(0, 0, W, H); if (logo) { const lh = 240; x.drawImage(logo, (W - lh * logo.width / logo.height) / 2, 150, lh * logo.width / logo.height, lh); } x.textAlign = 'center'; x.fillStyle = C.cream; x.font = '800 54px Manrope, sans-serif'; x.fillText('Terima kasih', W / 2, 470); x.fillStyle = C.gold2; x.font = '600 24px "Josefin Sans", sans-serif'; x.fillText(s.tagline.toUpperCase(), W / 2, 520); });
  const { jsPDF } = window.jspdf; const doc = new jsPDF({ orientation: 'landscape', unit: 'px', format: [W, H], hotfixes: ['px_scaling'] });
  slides.forEach((c, i) => { if (i) doc.addPage([W, H], 'landscape'); doc.addImage(c.toDataURL('image/jpeg', .85), 'JPEG', 0, 0, W, H); });
  shareBlob(doc.output('blob'), `Laporan-Bulanan-${M.ym}.pdf`, 'Laporan ' + fmtBln(M.ym));
}
async function exportXLS(M) {
  toast('Menyusun Excel…');
  try { await loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'); } catch (e) { return toast('Perlu internet untuk export Excel'); }
  const wb = XLSX.utils.book_new(), add = (name, rows) => XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), name);
  const kas = Object.fromEntries(DB.list('kas').filter(k => k.tgl.startsWith(M.ym)).map(k => [k.tgl, k]));
  add('Rekap Harian', M.days.map(d => { const tgl = M.ym + '-' + pad(d.d), D = dayStats(tgl), T = kas[tgl]?.tutup; return { Tanggal: tgl, Kepala: d.n, Pemasukan: d.v, Tunai: D.tunai, QRIS: D.qris, Pengeluaran: D.totalPg, 'Modal': kas[tgl]?.modal ?? '', 'Kas Seharusnya': kas[tgl] ? D.seharusnya : '', 'Uang Fisik': T?.fisik ?? '', Selisih: T?.selisih ?? '', Setor: T?.setor ?? '', 'Kasir Tutup': T?.kasir ?? '' }; }));
  add('Transaksi', M.tx.slice().sort((a, b) => a.at.localeCompare(b.at)).map(t => ({ Nota: t.nota, Tanggal: t.tgl, Jam: jam(t.at), Layanan: t.layanan, Harga: t.harga, Diskon: t.diskon || 0, 'Ket Promo': t.ketPromo || '', Total: t.batal ? 0 : t.total, Bayar: t.bayar, Kapster: t.kapster, Kasir: t.kasir, Pelanggan: t.pelanggan || '', WA: showWA(t.wa), Status: t.batal ? 'BATAL: ' + t.batalAlasan : 'OK' })));
  add('Pengeluaran', DB.list('pengeluaran').filter(p => p.tgl.startsWith(M.ym)).sort((a, b) => a.at.localeCompare(b.at)).map(p => ({ Tanggal: p.tgl, Jam: jam(p.at), Kategori: p.kategori, Keterangan: p.ket, Nominal: p.batal ? 0 : p.nominal, Kasir: p.kasir, Status: p.batal ? 'BATAL' : 'OK' })));
  add('Per Layanan', Object.entries(M.perLay).map(([k, v]) => ({ Layanan: k, Kepala: v.n, Pendapatan: v.v })));
  add('Per Kapster', Object.entries(M.perKap).map(([k, v]) => ({ Kapster: k, Kepala: v.n, Pendapatan: v.v })));
  const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  shareBlob(new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), `Rekap-${M.ym}.xlsx`, 'Rekap ' + fmtBln(M.ym));
}

/* ---------- riwayat perubahan ---------- */
function oLog(el) {
  const ev = [];
  for (const t of DB.list('transaksi')) for (const l of t.log || []) ev.push({ ...l, ref: t.nota + ' · ' + t.layanan + ' ' + rp(t.harga) });
  for (const p of DB.list('pengeluaran')) for (const l of p.log || []) ev.push({ ...l, ref: 'Pengeluaran · ' + p.ket });
  for (const k of DB.list('kas')) { for (const l of k.log || []) ev.push({ ...l, ref: 'Kas ' + fmtTglS(k.tgl) }); if (k.tutup?.selisih) ev.push({ at: k.tutup.at, oleh: k.tutup.kasir, aksi: 'Selisih kas', detail: rp(k.tutup.selisih) + (k.tutup.catatan ? ' · ' + k.tutup.catatan : ''), ref: 'Tutup kas ' + fmtTglS(k.tgl) }); }
  ev.sort((a, b) => b.at.localeCompare(a.at));
  el.innerHTML = `<div class="hint">Pembatalan, perubahan, buka ulang kas, dan selisih kas selama ${CACHE_DAYS} hari terakhir.</div>
    <div class="list">${ev.length ? ev.slice(0, 150).map(e => `<div class="item"><div class="main"><div class="t">${esc(e.aksi)} · ${esc(e.ref)}</div><div class="s" style="white-space:normal">${esc(e.detail || '')}</div><div class="s">${esc(e.oleh)} · ${fmtTglS(e.at.slice(0, 10))} ${jam(e.at)}</div></div>${e.aksi === 'Batal' || e.aksi === 'Selisih kas' ? '<span class="tag void">!</span>' : ''}</div>`).join('') : '<div class="empty">Belum ada perubahan tercatat. Bagus.</div>'}</div>`;
}

/* ============================================================
   DATA: BACKUP, IMPORT, RESET
   ============================================================ */
const TX_COLS = ['transaksi', 'pengeluaran', 'kas', 'pelanggan'];
function oData(el) {
  const cnt = c => DB.list(c).length;
  el.innerHTML = `
    <div class="card sec"><h2>Backup data</h2>
      <div class="hint">Simpan semua data (transaksi, pengeluaran, kas, pelanggan, kapster, layanan, pengaturan) ke satu file .json. Simpan di Google Drive atau kirim ke WA sendiri.</div>
      <button class="btn" id="exp">Export backup</button></div>
    <div class="card sec"><h2>Import dari backup</h2>
      <div class="hint">Data yang sudah ada tidak akan dobel. Setiap data punya ID sendiri, jadi data dengan ID yang sama diperbarui, bukan ditambah. Kalau data di HP ini lebih baru, data di HP ini yang dipakai.</div>
      <label class="btn ghost" for="impF" style="cursor:pointer">Pilih file backup (.json)</label><input id="impF" type="file" accept=".json,application/json" hidden></div>
    <div class="card sec" style="border-color:#e7c6c0"><h2 style="color:var(--bad)">Reset data</h2>
      <div class="hint">Untuk mulai dari nol setelah uji coba. Tidak bisa dibatalkan, jadi export backup dulu.</div>
      <div class="kv small"><div><span>Transaksi</span><b>${cnt('transaksi')}</b></div><div><span>Pengeluaran</span><b>${cnt('pengeluaran')}</b></div><div><span>Hari kas</span><b>${cnt('kas')}</b></div><div><span>Pelanggan</span><b>${cnt('pelanggan')}</b></div></div>
      <button class="btn danger" id="rst1">Reset transaksi saja</button>
      <div class="hint">Menghapus transaksi, pengeluaran, kas, pelanggan, dan riwayat. Kapster, harga layanan, template WA, password, dan koneksi tetap.</div>
      <button class="btn danger" id="rst2">Reset total</button>
      <div class="hint">Menghapus semuanya termasuk kapster, layanan, dan pengaturan. Aplikasi kembali seperti baru dipasang (password kembali 1234). Koneksi online tetap tersimpan.</div>
    </div>`;
  $('#exp').onclick = exportBackup;
  $('#impF').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) importBackup(f); };
  $('#rst1').onclick = () => resetData('transaksi');
  $('#rst2').onclick = () => resetData('total');
}
async function exportBackup() {
  toast('Menyiapkan backup…');
  let docs; try { docs = await DB.fetchAll(); } catch (e) { return toast('Gagal mengambil data online: ' + e.message); }
  const local = Object.values(DB.pending); const map = Object.fromEntries(docs.map(d => [d.id, d])); local.forEach(d => map[d.id] = d);
  const out = { app: 'naufals-barber-kasir', versi: 1, dibuat: nowISO(), jumlah: Object.keys(map).length, docs: Object.values(map) };
  const stamp = today() + '_' + jam(nowISO()).replace('.', '');
  shareBlob(new Blob([JSON.stringify(out)], { type: 'application/json' }), `Backup-Kasir-Barber-${stamp}.json`, 'Backup kasir');
  return true;
}
async function importBackup(file) {
  let data; try { data = JSON.parse(await file.text()); } catch (e) { return toast('File tidak bisa dibaca. Pastikan ini file backup .json'); }
  if (data?.app !== 'naufals-barber-kasir' || !Array.isArray(data.docs)) return toast('Ini bukan file backup kasir barber');
  const ok = await ask({ title: 'Import backup?', body: `File berisi ${data.docs.length} data, dibuat ${fmtTglS(String(data.dibuat).slice(0, 10))}. Data yang sama tidak akan dobel.`, ok: 'Import' });
  if (!ok) return;
  let baru = 0, upd = 0, skip = 0;
  for (const d of data.docs) {
    if (!d?.id || !d.col || !d.data || d.id === 'reset') { skip++; continue; }
    const cur = DB.docs[d.id];
    if (cur && new Date(cur.updated_at) >= new Date(d.updated_at)) { skip++; continue; }
    cur ? upd++ : baru++;
    DB.docs[d.id] = d; DB.pending[d.id] = d;
  }
  DB.saveCache(); DB.flush(); shell(); render();
  ask({ title: 'Import selesai', body: `${baru} data baru ditambahkan, ${upd} diperbarui, ${skip} dilewati karena sudah ada atau lebih baru di HP ini.`, ok: 'OK', cancel: 'Tutup' });
}
async function resetData(scope) {
  const total = scope === 'total';
  const step1 = await ask({ title: total ? 'Reset total?' : 'Reset transaksi?', body: 'Sebaiknya export backup dulu. Tekan "Export dulu" untuk menyimpan backup, lalu ulangi reset.', ok: 'Lanjut tanpa backup', cancel: 'Export dulu', danger: true });
  if (!step1) return exportBackup();
  const typed = await ask({ title: 'Ketik HAPUS untuk konfirmasi', body: total ? 'Semua data dan pengaturan akan dihapus dari semua HP yang tersambung.' : 'Transaksi, pengeluaran, kas, dan pelanggan akan dihapus dari semua HP yang tersambung.', input: { label: 'Konfirmasi', ph: 'HAPUS', required: 'Ketik HAPUS' }, ok: 'Hapus permanen', danger: true });
  if (typed == null) return;
  if (typed.trim().toUpperCase() !== 'HAPUS') return toast('Konfirmasi salah, tidak ada yang dihapus');
  const cols = total ? null : TX_COLS;
  try { await DB.remove(total ? 'id=not.is.null' : 'col=in.(' + TX_COLS.join(',') + ')'); }
  catch (e) { return toast('Gagal menghapus data online: ' + e.message + '. Cek izin hapus di SQL Supabase.'); }
  const at = nowISO();
  wipeLocal(cols, at);
  DB.put('meta', { id: 'reset', at, scope });
  lsSet('nb_resetSeen', at);
  if (total) { DB.put('settings', { ...DEF_SETTINGS }); DEF_LAYANAN.forEach(l => DB.put('layanan', { ...l })); S.kasir = ''; lsSet('nb_kasir', ''); S.owner = false; ssSet('nb_owner', '0'); }
  S.date = today(); S.tab = 'kasir'; shell(); render();
  toast(total ? 'Reset total selesai' : 'Data transaksi direset. Mulai dari nol!', 3000);
}
function wipeLocal(cols, before) {
  for (const [id, d] of Object.entries(DB.docs)) {
    if (id === 'reset') continue;
    if ((!cols || cols.includes(d.col)) && new Date(d.updated_at) <= new Date(before)) { delete DB.docs[id]; delete DB.pending[id]; }
  }
  DB.saveCache();
}
function applyRemoteReset() {   // HP lain yang ikut tersambung ikut bersih setelah reset
  const r = DB.get('reset'); if (!r || r.at <= lsGet('nb_resetSeen', '')) return;
  wipeLocal(r.scope === 'total' ? null : TX_COLS, r.at); lsSet('nb_resetSeen', r.at);
  if (r.scope === 'total') { S.kasir = ''; lsSet('nb_kasir', ''); }
  if (!DB.get('settings')) seedIfEmpty();
}

/* ============================================================
   BOOT
   ============================================================ */
(async function boot() {
  DB.init();
  if (!DB.online() || DB.get('settings')) seedIfEmpty();   // HP baru yang online: tunggu data online dulu
  shell(); render();
  if (DB.online()) { await DB.pull(); if (DB.status !== 'off') seedIfEmpty(); shell(); render(); }
  setInterval(() => { if (S.followToday && S.date !== today()) { S.date = today(); if (!$('#scrim')) render(); } }, 30000);
  setInterval(async () => { if (document.hidden || !DB.online()) return; await DB.pull(); if (!$('#scrim') && !document.activeElement?.matches('input,textarea')) render(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && DB.online()) DB.pull().then(() => { if (!$('#scrim')) render(); }); });
  window.addEventListener('online', () => DB.flush());
})();
